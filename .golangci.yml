# golangci-lint v2 config
# IMPORTANT: v2 config is NOT compatible with v1
# Version is pinned in two places and Dependabot covers neither -- the gomod
# ecosystem cannot see a Makefile variable, and the github-actions ecosystem
# bumps the action's `uses:` SHA, not its `version:` input. Bump both by hand:
#   Makefile                   GOLANGCI_LINT_VERSION
#   .github/workflows/ci.yml   golangci-lint-action `version:`
version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - gocritic
    - gocyclo
    - godoclint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    godoclint:
      require-doc: true
      require-pkg-doc: true
      check-start-with-name: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    misspell:
      ignore-rules:
        - RELA
        - WITN
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - path: _test\.go
        text: SA5011
      # The record-level Notes field is deprecated in favor of NoteXRefs and
      # InlineNotes (issue #290), but must stay populated and readable during
      # the deprecation window, so internal uses of it are expected.
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use NoteXRefs and InlineNotes'
      # The symbols v3 removes carry a // Deprecated: marker from v2.5.0 on, so
      # callers get a tooling warning before the break (issue #522). The library
      # itself must keep using them for the whole deprecation window -- the
      # decoder populates them and the encoder emits from them -- so its own
      # uses are expected. Each pattern names one deprecation message; that
      # keeps the exclusion tied to a specific removal rather than blanket
      # -disabling SA1019, which would also hide a genuinely stale call.
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use \[Event\.PlaceName\]'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use \[Attribute\.PlaceName\]'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use \[Record\.Tags\]'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use RepositoryLink'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: v3 replaces this field with an accessor pair'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: renamed to Families(AsChild|AsSpouse)'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: read Text, which already holds'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: use \[gedcom\.Version\.IsValid\]'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: v3 replaces this with DropUnknownTags'
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated: the name is wrong'
      - linters:
          - lll
          - gocritic
          - gocyclo
        path: examples/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
