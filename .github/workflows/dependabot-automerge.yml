name: Dependabot Auto-Merge

on: pull_request_target

# The logic lives in cacack/workflows so a fix lands once for every repo that
# calls it, instead of being copy-pasted and drifting. Pinned to a tag, so
# changes there are opt-in here.
#
# `secrets: inherit` passes this repo's BOT_APP_ID / BOT_PRIVATE_KEY (the
# gedcom-go-steward App) through to the called workflow.
#
# A called workflow's job cannot request more than the caller grants here, so
# this must cover what that job declares — pull-requests included, or the run
# fails at startup before any step executes (#371).
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    uses: cacack/workflows/.github/workflows/dependabot-automerge.yml@v1
    secrets: inherit
