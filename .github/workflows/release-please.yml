name: Release Please

on:
  push:
    branches:
      - main

# Restrict default GITHUB_TOKEN permissions (principle of least privilege).
# Release-please needs write access to create release PRs and tags.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # Release PRs and tags are authored by the repo's GitHub App rather than a
      # maintainer PAT. An installation token also triggers CI on the release PR,
      # which GITHUB_TOKEN would not.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: go
          token: ${{ steps.app-token.outputs.token }}

  # Trigger pkg.go.dev indexing after release
  publish-docs:
    name: Trigger pkg.go.dev
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trigger pkg.go.dev indexing
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          MODULE=$(awk '/^module / {print $2}' go.mod)
          echo "Triggering pkg.go.dev for $MODULE@$VERSION..."
          curl -f "https://proxy.golang.org/$MODULE/@v/$VERSION.info" || true
          curl -f "https://sum.golang.org/lookup/$MODULE@$VERSION" || true
          echo "Indexing request sent to pkg.go.dev"
          echo "Documentation will be available at: https://pkg.go.dev/$MODULE@$VERSION"
