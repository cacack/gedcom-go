name: Nightly

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

# Restrict default GITHUB_TOKEN permissions (principle of least privilege).
# Per-job permissions scope additional writes where they're needed.
permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./parser
            fuzz: ^FuzzParse$
            time: 2m
          - package: ./parser
            fuzz: ^FuzzParseLine$
            time: 2m
          - package: ./gedcom
            fuzz: ^FuzzParseDate$
            time: 2m
          - package: ./charset
            fuzz: ^FuzzNewReader$
            time: 2m
          - package: ./charset
            fuzz: ^FuzzNewReaderWithEncoding$
            time: 2m
          - package: ./decoder
            fuzz: ^FuzzDecode$
            time: 2m
          - package: ./decoder
            fuzz: ^FuzzDecodeRoundTrip$
            time: 2m
          - package: ./converter
            fuzz: ^FuzzValidateConvert$
            time: 2m
          - package: ./encoder
            fuzz: ^FuzzEncodeRoundTrip$
            time: 2m
          - package: ./gedzip
            fuzz: ^FuzzGEDZipReader$
            time: 2m

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: true

    - name: Run ${{ matrix.fuzz }}
      # Retry once on the "context deadline exceeded" race, where Go's fuzz
      # coordinator cancels an in-flight iteration right at the -fuzztime
      # boundary on slow/contended runners. A real failing input (which writes
      # to testdata/fuzz/...) still fails immediately on the first attempt.
      run: |
        set -o pipefail
        run_fuzz() {
          go test ${{ matrix.package }} -fuzz=${{ matrix.fuzz }} \
            -fuzztime=${{ matrix.time }} -timeout=0 2>&1 | tee fuzz.out
        }
        if run_fuzz; then exit 0; fi
        if grep -q "context deadline exceeded" fuzz.out \
           && ! grep -q "Failing input written" fuzz.out; then
          echo "::warning::Fuzztime-deadline race detected; retrying once."
          run_fuzz
        else
          exit 1
        fi

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-corpus-${{ matrix.fuzz }}
        path: '**/testdata/fuzz/**'
        retention-days: 30

  # The gedcom.io test files are fetched, not vendored (#718). PR CI tolerates
  # a failed fetch so a network outage cannot block it; here a vanished or
  # changed source must fail, so the fetch uses -require and a missing file
  # fails its tests instead of skipping them.
  corpora:
    name: Fetched Test Corpora
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: true

    - name: Fetch test corpora
      run: go run ./internal/cmd/fetchcorpora -require

    - name: Run tests with the fetched corpora required
      env:
        GEDCOM_REQUIRE_FETCHED_CORPORA: '1'
      run: go test -timeout 10m ./...

  security:
    name: Security Scan (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable

    - name: Run govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
      with:
        go-version-file: go.mod
        repo-checkout: false
        output-format: sarif
        output-file: govulncheck-results.sarif

    - name: Upload govulncheck results
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: success() || failure()
      with:
        sarif_file: govulncheck-results.sarif
        category: govulncheck

    - name: Run gosec
      uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # master (docker: 2.25.0)
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

    - name: Upload gosec results
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: success() || failure()
      with:
        sarif_file: gosec-results.sarif
        category: gosec

    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: (success() || failure()) && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: trivy-results.sarif
        category: trivy

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [fuzz, corpora, security]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Create issue on failure
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Check if an open nightly failure issue already exists
        EXISTING=$(gh issue list --label "nightly-failure" --state open --json number --jq '.[0].number')
        if [ -n "$EXISTING" ]; then
          gh issue comment "$EXISTING" --body "Nightly workflow failed again on $(date -u +%Y-%m-%d).

        [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "Commented on existing issue #$EXISTING"
          exit 0
        fi

        gh issue create \
          --title "Nightly workflow failure ($(date -u +%Y-%m-%d))" \
          --label "nightly-failure" \
          --body "The nightly workflow failed on $(date -u +%Y-%m-%d).

        **Fuzz testing**: ${{ needs.fuzz.result }}
        **Fetched test corpora**: ${{ needs.corpora.result }}
        **Security scan**: ${{ needs.security.result }}

        [View full run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

        ---
        This issue was created automatically. Close it once the failure is resolved."
