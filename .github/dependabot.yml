version: 2
updates:
  # Go modules (library dependencies)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    # Time-boxed (#746): golang.org/x/text v0.42.0+ declares `go 1.26`, so
    # taking it would raise this module's floor above go.mod's `go 1.25.0`.
    # Remove this rule in the change that raises go.mod's `go` line to 1.26 or
    # later; TestDependabotIgnoreIsLiftedWithTheGoFloor fails until it is gone.
    # It also holds back security updates: if an x/text advisory is fixed only
    # in v0.42.0+, raise the floor then rather than wait.
    ignore:
      - dependency-name: "golang.org/x/text"
        versions: [">= 0.42.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # Ship minor/patch action bumps as one PR. Individual PRs break CodeQL,
    # which requires init/autobuild/analyze/upload-sarif on a matching version,
    # and leave later PRs stale once the first one merges. Majors stay separate.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
